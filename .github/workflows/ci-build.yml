name: CI Build

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - '1.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon --console=plain

      - name: Upload compile reports
        uses: actions/upload-artifact@v4
        with:
          name: neb-compile-reports
          path: |
            build/reports/**
